name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/lab.sh test
      - run: python3 scripts/check.py
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f examples/flink/compose.yaml config --quiet
      - run: docker compose -f examples/fluss/compose.yaml config --quiet
      - run: docker compose -f compose.yaml -f examples/materialize/compose.yaml config --quiet
      - run: docker compose -f compose.yaml -f examples/arroyo/compose.yaml config --quiet
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example: [main, flink, materialize, arroyo]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/lab.sh demo
      - name: Verify persistence after container restart
        if: matrix.example == 'main'
        run: |
          docker compose restart kafka postgres risingwave
          docker compose --profile tools run --rm lab verify
          docker compose --profile tools run --rm lab replay
          docker compose --profile tools run --rm lab verify
          bash scripts/lab.sh recovery
      - name: Verify comparison
        if: matrix.example != 'main'
        run: python3 scripts/compare.py "${{ matrix.example }}"
      - name: Logs
        if: always()
        run: |
          if [ '${{ matrix.example }}' = main ]; then
            docker compose logs --no-color --tail=150
          else
            docker compose -f compose.yaml -f examples/${{ matrix.example }}/compose.yaml logs --no-color --tail=150
          fi
      - name: Clean up disposable runner volumes
        if: always()
        run: |
          if [ '${{ matrix.example }}' = main ]; then
            docker compose down -v
          else
            docker compose -f compose.yaml -f examples/${{ matrix.example }}/compose.yaml down -v
          fi
  fluss:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/compare.py fluss
      - name: Logs
        if: always()
        run: docker compose -f examples/fluss/compose.yaml logs --no-color --tail=150
      - name: Clean up disposable runner volumes
        if: always()
        run: docker compose -f examples/fluss/compose.yaml down -v
  iceberg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/iceberg/requirements.txt
      - run: pip install -r examples/iceberg/requirements.txt
      - run: python examples/iceberg/landing.py
      - name: Verify overwrite produces the same current result
        run: python examples/iceberg/landing.py
