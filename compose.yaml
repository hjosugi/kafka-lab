name: kafka-lab
services:
  kafka:
    image: docker.io/apache/kafka:4.3.1
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
  postgres:
    image: docker.io/library/postgres:17
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=10, -c, max_wal_senders=10]
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-only
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lab -d shop"]
      interval: 5s
      timeout: 5s
      retries: 30
  risingwave:
    mem_limit: 3g
    image: docker.io/risingwavelabs/risingwave:v3.0.3
    command: [single_node, --store-directory, /data, --parallelism, "2", --config-path, /etc/risingwave.toml]
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:5691:5691"
    volumes:
      - rw-data:/data
      - ./config/risingwave.toml:/etc/risingwave.toml:ro
  lab:
    build: .
    profiles: [tools]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PG_DSN: postgresql://lab:lab-only@postgres:5432/shop
      RW_DSN: postgresql://root@risingwave:4566/dev
      TARGET_DB: /state/target.sqlite
    volumes:
      - target-data:/state
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      risingwave:
        condition: service_started
volumes:
  kafka-data:
  pg-data:
  rw-data:
  target-data:
